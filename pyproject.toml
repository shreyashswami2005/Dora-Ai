[project]
name = "campuslearn"
version = "0.1.0"
dependencies = [
    "Django>=5.0,<6.0",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "weasyprint>=69.0",
    "qrcode[pil]>=8.2",
    "qrcode>=8.2",
    "Pillow>=10.1,<11",
    "vercel-wsgi>=0.2.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
